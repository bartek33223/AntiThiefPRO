buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 uses built-in Kotlin. This upgrades the KGP runtime used by it.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    id 'com.android.application' version '9.3.3' apply false
}
